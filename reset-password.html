<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Artivio</title>
  <script src="config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fdf6ee;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .reset-container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 { color: #6C2929; margin-bottom: 10px; }
    .subtitle { color: #666; margin-bottom: 30px; }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #6C2929;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #5a2222; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
    }
    .success { background: #d1fae5; color: #065f46; }
    .error { background: #fee2e2; color: #991b1b; }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #6C2929;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <h1>Reset Password</h1>
    <p class="subtitle">Create a new password for your account</p>
    
    <div class="input-group">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="Enter new password">
    </div>
    
    <div class="input-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm new password">
    </div>
    
    <button id="resetBtn">Reset Password</button>
    <div id="message"></div>
    <a href="login.html" class="back-link">← Back to Login</a>
  </div>

  <script>
    const API_BASE = window.API_BASE || window.location.origin;
    
    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    let resetToken = urlParams.get('token');
    
    if (!resetToken) {
      document.getElementById('message').innerHTML = '<div class="message error">Invalid or missing reset token. Please request a new link.</div>';
      document.getElementById('resetBtn').disabled = true;
    }
    
    document.getElementById('resetBtn').addEventListener('click', async () => {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const messageDiv = document.getElementById('message');
      
      if (!newPassword || !confirmPassword) {
        messageDiv.innerHTML = '<div class="message error">Please fill in both fields</div>';
        return;
      }
      
      if (newPassword.length < 6) {
        messageDiv.innerHTML = '<div class="message error">Password must be at least 6 characters</div>';
        return;
      }
      
      if (newPassword !== confirmPassword) {
        messageDiv.innerHTML = '<div class="message error">Passwords do not match</div>';
        return;
      }
      
      const btn = document.getElementById('resetBtn');
      btn.disabled = true;
      btn.textContent = 'Resetting...';
      
      try {
        const response = await fetch(`${API_BASE}/api/users/reset-password/${resetToken}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ newPassword })
        });
        
        const result = await response.json();
        
        if (result.success) {
          messageDiv.innerHTML = '<div class="message success">✅ Password reset successfully! Redirecting to login...</div>';
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          messageDiv.innerHTML = `<div class="message error">❌ ${result.error || 'Reset failed'}</div>`;
          btn.disabled = false;
          btn.textContent = 'Reset Password';
        }
      } catch (err) {
        messageDiv.innerHTML = '<div class="message error">❌ Network error. Please try again.</div>';
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
