<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Artivio</title>
  <link rel="stylesheet" href="https://omarezzat7070.github.io/artivio/assets/fontawesome/css/all.min.css">
  <style>
    :root { --primary: #6C2929; --bg: #fdf6ee; }
    body { background: var(--bg); font-family: "Segoe UI", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .container { background: #fff; width: 100%; max-width: 400px; padding: 40px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
    h1 { color: var(--primary); margin-bottom: 10px; }
    p { color: #666; margin-bottom: 25px; font-size: 14px; }
    .input-box { display: flex; align-items: center; background: #f4f4f4; padding: 12px; border-radius: 8px; margin-bottom: 18px; text-align: left; }
    .input-box i { margin-right: 10px; color: #999; }
    .input-box input { border: none; background: transparent; outline: none; width: 100%; }
    .btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    #message { margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>New Password</h1>
    <p>Please enter your new password below.</p>
    
    <div class="input-box">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="newPassword" placeholder="New Password (min 6 chars)">
    </div>
    <div class="input-box">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="confirmPassword" placeholder="Confirm New Password">
    </div>
    
    <button class="btn" id="resetBtn">Update Password</button>
    <div id="message"></div>
  </div>

  <script src="config.js"></script>
  <script>
    const API_BASE = window.API_BASE || window.location.origin;
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    document.getElementById('resetBtn').addEventListener('click', async () => {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const messageDiv = document.getElementById('message');

      if (!token) {
        messageDiv.textContent = "Invalid or missing token.";
        messageDiv.style.color = "red";
        return;
      }

      if (newPassword.length < 6) {
        messageDiv.textContent = "Password must be at least 6 characters.";
        messageDiv.style.color = "red";
        return;
      }

      if (newPassword !== confirmPassword) {
        messageDiv.textContent = "Passwords do not match.";
        messageDiv.style.color = "red";
        return;
      }

      const btn = document.getElementById('resetBtn');
      btn.disabled = true;
      btn.textContent = "Updating...";

      try {
        const res = await fetch(`${API_BASE}/api/users/reset-password/${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ newPassword })
        });

        const data = await res.json();
        if (data.success) {
          messageDiv.textContent = "Password updated! Redirecting to login...";
          messageDiv.style.color = "green";
          setTimeout(() => window.location.href = 'login.html', 2500);
        } else {
          messageDiv.textContent = data.error || "Reset failed.";
          messageDiv.style.color = "red";
          btn.disabled = false;
          btn.textContent = "Update Password";
        }
      } catch (err) {
        messageDiv.textContent = "Network error.";
        messageDiv.style.color = "red";
        btn.disabled = false;
        btn.textContent = "Update Password";
      }
    });
  </script>
</body>
</html>
