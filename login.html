<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Artisan Crafts</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://omarezzat7070.github.io/artivio/assets/fontawesome/css/all.min.css">
  <script src="assets/lucide.min.js"></script>

  <style>
    :root {
      --primary: #6C2929;
      --dark: #3d1616;
      --light-bg: #fdf6ee;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background: var(--light-bg);
      color: #333;
    }

    .login-section {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 80px);
    }

    .login-container {
      background: #fff;
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    .login-container h1 {
      color: #8b4000;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .role-toggle {
      display: flex;
      background: #f1f1f1;
      border-radius: 30px;
      margin-bottom: 25px;
      padding: 4px;
    }

    .role-toggle button {
      flex: 1;
      border: none;
      padding: 10px;
      background: transparent;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
    }

    .role-toggle .active {
      background: #fff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }

    .login-form {
      text-align: left;
    }

    .login-form label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
      display: block;
    }

    .input-box {
      display: flex;
      align-items: center;
      background: #f4f4f4;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
    }

    .input-box i {
      margin-right: 10px;
      color: #999;
    }

    .input-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
    }

    .login-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .login-btn:hover { background: var(--dark); }
    .login-btn:disabled { opacity: 0.65; cursor: not-allowed; }

    .signup-text {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
    }

    .signup-text a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .forgot-row {
      text-align: right;
      margin-top: -10px;
      margin-bottom: 12px;
    }

    .forgot-btn {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .forgot-panel {
      display: none;
      text-align: left;
      background: #faf6f5;
      border: 1px solid #ead9d4;
      border-radius: 12px;
      padding: 18px;
      margin-top: 20px;
    }

    .forgot-panel.active { display: block; }

    .forgot-panel h3 {
      color: var(--primary);
      margin-bottom: 6px;
    }

    .forgot-panel .step-hint {
      color: #666;
      font-size: 13px;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .secondary-btn {
      width: 100%;
      background: #e5e7eb;
      color: #333;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .secondary-btn:hover { background: #d1d5db; }

    .message-success {
      color: #065f46;
      background: #d1fae5;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 13px;
    }

    .message-error {
      color: #991b1b;
      background: #fee2e2;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
  <link rel="stylesheet" href="navbar.css">
</head>
<body>
<script src="config.js"></script>

<header class="navbar">
  <div class="container nav-content">
    <div class="nav-logo">
      <a href="index.html"><img src="no background 1.png" alt="Artivio Logo"></a>
      <span class="artivio">Artivio</span>
    </div>
    <nav>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="product.html"><i data-lucide="shopping-bag" class="icon-sm"></i> Products</a></li>
        <li><a href="customercourses.html"><i data-lucide="book-open" class="icon-sm"></i> Courses</a></li>
        <li><a href="about.html">About</a></li>
        <li><a id="loginLink" href="login.html"><i data-lucide="user" class="icon-sm"></i> Login</a></li>
      </ul>
      <div class="menu-icon" id="menuIcon">
        <i data-lucide="menu"></i>
      </div>
    </nav>
  </div>
</header>

<section class="login-section">
  <div class="login-container">
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to your account</p>

    <div class="role-toggle">
      <button class="active" id="customerBtn">Customer</button>
      <button id="artisanBtn">Artisan</button>
    </div>

    <form class="login-form" id="loginForm">
      <label for="email">Email</label>
      <div class="input-box">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
      </div>

      <label for="password">Password</label>
      <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>

      <div class="forgot-row">
        <button type="button" class="forgot-btn" id="showForgotBtn">Forgot password?</button>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">Sign In as Customer</button>
      <p id="loginMessage" style="text-align: center; margin-top: 12px; font-size: 13px;"></p>

      <p class="signup-text">
        Don't have an account?
        <a href="sign-up.html">Sign up</a>
      </p>
    </form>

    <!-- Forgot Password Panel -->
    <div class="forgot-panel" id="forgotPanel">
      <h3>Reset Password</h3>
      <p class="step-hint">Enter your email address and we'll send you a link to reset your password.</p>

      <label for="fpEmail">Email</label>
      <div class="input-box">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" id="fpEmail" placeholder="your@email.com" required>
      </div>

      <button type="button" class="login-btn" id="sendResetLinkBtn">Send Reset Link</button>
      <button type="button" class="secondary-btn" id="hideForgotBtn">Back to Login</button>
      <div id="fpMessage"></div>
    </div>
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function () {
  if (window.lucide) lucide.createIcons();

  const menuIcon = document.getElementById('menuIcon');
  const navLinks = document.getElementById('navLinks');
  if (menuIcon && navLinks) menuIcon.addEventListener('click', () => navLinks.classList.toggle('active'));

  // Role toggle
  const customerBtn = document.getElementById("customerBtn");
  const artisanBtn = document.getElementById("artisanBtn");
  const loginBtn = document.getElementById("loginBtn");
  let selectedRole = "customer";

  if (customerBtn && artisanBtn && loginBtn) {
    customerBtn.addEventListener("click", () => {
      customerBtn.classList.add("active");
      artisanBtn.classList.remove("active");
      loginBtn.textContent = "Sign In as Customer";
      selectedRole = "customer";
    });

    artisanBtn.addEventListener("click", () => {
      artisanBtn.classList.add("active");
      customerBtn.classList.remove("active");
      loginBtn.textContent = "Sign In as Artisan";
      selectedRole = "artisan";
    });
  }

  // Login form submission
  const loginForm = document.getElementById("loginForm");
  const loginMessage = document.getElementById("loginMessage");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  if (loginForm) {
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginMessage.textContent = "";
      
      if (loginBtn) {
        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in...";
      }

      try {
        const response = await fetch(`${window.API_BASE}/api/users/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            email: emailInput.value.trim(), 
            password: passwordInput.value 
          })
        });

        const result = await response.json();
        
        if (!response.ok || !result.success) {
          loginMessage.style.color = "red";
          loginMessage.textContent = result.error || "Login failed";
          if (loginBtn) {
            loginBtn.disabled = false;
            loginBtn.textContent = selectedRole === "artisan" ? "Sign In as Artisan" : "Sign In as Customer";
          }
          return;
        }

        // Role validation
        if (selectedRole === "artisan" && !["artisan", "seller"].includes(result.user.role)) {
          loginMessage.style.color = "red";
          loginMessage.textContent = "This account is not registered as an artisan/seller";
          if (loginBtn) {
            loginBtn.disabled = false;
            loginBtn.textContent = "Sign In as Artisan";
          }
          return;
        }
        
        if (selectedRole === "customer" && result.user.role !== "customer") {
          loginMessage.style.color = "red";
          loginMessage.textContent = "Please use the Artisan login for this account";
          if (loginBtn) {
            loginBtn.disabled = false;
            loginBtn.textContent = "Sign In as Customer";
          }
          return;
        }

        localStorage.setItem("token", result.token);
        localStorage.setItem("user", JSON.stringify(result.user));
        
        loginMessage.style.color = "green";
        loginMessage.textContent = "Login successful! Redirecting...";

        setTimeout(() => {
          if (result.user.role === "admin") window.location.href = "admindashboard.html";
          else if (["artisan", "seller"].includes(result.user.role)) window.location.href = "seller.html";
          else window.location.href = "index.html";
        }, 700);

      } catch (err) {
        loginMessage.style.color = "red";
        loginMessage.textContent = "Network error. Please try again.";
        if (loginBtn) {
          loginBtn.disabled = false;
          loginBtn.textContent = selectedRole === "artisan" ? "Sign In as Artisan" : "Sign In as Customer";
        }
      }
    });
  }

  // Forgot password panel
  const forgotPanel = document.getElementById("forgotPanel");
  const showForgotBtn = document.getElementById("showForgotBtn");
  const hideForgotBtn = document.getElementById("hideForgotBtn");
  const sendResetLinkBtn = document.getElementById("sendResetLinkBtn");
  const fpEmail = document.getElementById("fpEmail");
  const fpMessage = document.getElementById("fpMessage");

  if (showForgotBtn && forgotPanel) {
    showForgotBtn.addEventListener("click", () => {
      forgotPanel.classList.add("active");
      if (emailInput.value.trim()) {
        fpEmail.value = emailInput.value.trim();
      }
      fpMessage.innerHTML = "";
    });
  }

  if (hideForgotBtn && forgotPanel) {
    hideForgotBtn.addEventListener("click", () => {
      forgotPanel.classList.remove("active");
      fpEmail.value = "";
      fpMessage.innerHTML = "";
    });
  }

  // Send reset link
  if (sendResetLinkBtn) {
    sendResetLinkBtn.addEventListener("click", async () => {
      const email = fpEmail.value.trim();
      
      if (!email) {
        fpMessage.innerHTML = '<div class="message-error">Please enter your email address</div>';
        return;
      }

      sendResetLinkBtn.disabled = true;
      sendResetLinkBtn.textContent = "Sending...";

      try {
        const response = await fetch(`${window.API_BASE}/api/users/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        const result = await response.json();

        if (result.success) {
          fpMessage.innerHTML = `
            <div class="message-success">
              ✅ If an account exists with this email, you will receive a password reset link shortly.
            </div>
          `;
          // Don't close the panel, let user read the message
          setTimeout(() => {
            forgotPanel.classList.remove("active");
            fpEmail.value = "";
            fpMessage.innerHTML = "";
          }, 4000);
        } else {
          fpMessage.innerHTML = `<div class="message-error">❌ ${result.error || "Something went wrong"}</div>`;
        }
      } catch (err) {
        fpMessage.innerHTML = '<div class="message-error">❌ Network error. Please try again.</div>';
      } finally {
        sendResetLinkBtn.disabled = false;
        sendResetLinkBtn.textContent = "Send Reset Link";
      }
    });
  }
});
</script>

<script src="navbar.js"></script>
</body>
</html>
