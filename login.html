<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Artisan Crafts</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://omarezzat7070.github.io/artivio/assets/fontawesome/css/all.min.css">

  <script src="assets/lucide.min.js"></script>

  <!-- ===== INTERNAL CSS ===== -->
  <style>
    :root {
  --primary: #6C2929;
  --dark: #3d1616;
  --light-bg: #fdf6ee;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: var(--light-bg);
  color: #333;
}

/* ===== Login Section ===== */
.login-section {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: calc(100vh - 80px);
}

.login-container {
  background: #fff;
  width: 100%;
  max-width: 420px;
  padding: 35px;
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  text-align: center;
}

.login-container h1 {
  color: #8b4000;
  margin-bottom: 8px;
}

.subtitle {
  color: #666;
  margin-bottom: 25px;
  font-size: 14px;
}

/* Toggle */
.role-toggle {
  display: flex;
  background: #f1f1f1;
  border-radius: 30px;
  margin-bottom: 25px;
  padding: 4px;
}

.role-toggle button {
  flex: 1;
  border: none;
  padding: 10px;
  background: transparent;
  border-radius: 30px;
  cursor: pointer;
  font-weight: 600;
}

.role-toggle .active {
  background: #fff;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
}

/* Form */
.login-form {
  text-align: left;
}

.login-form label {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 5px;
  display: block;
}

.input-box {
  display: flex;
  align-items: center;
  background: #f4f4f4;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 18px;
}

.input-box i {
  margin-right: 10px;
  color: #999;
}

.input-box input {
  border: none;
  background: transparent;
  outline: none;
  width: 100%;
}

/* Button */
.login-btn {
  width: 100%;
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
}

.login-btn:hover { background: var(--dark); }
.login-btn:disabled { opacity: 0.65; cursor: not-allowed; }

/* Signup */
.signup-text {
  text-align: center;
  margin-top: 18px;
  font-size: 14px;
}

.signup-text a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
}
.forgot-row {
  text-align: right;
  margin-top: -10px;
  margin-bottom: 12px;
}

.forgot-btn {
  background: none;
  border: none;
  color: var(--primary);
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
}

/* ── Forgot Panel ── */
.forgot-panel {
  display: none;
  text-align: left;
  background: #faf6f5;
  border: 1px solid #ead9d4;
  border-radius: 12px;
  padding: 18px;
  margin-top: 20px;
}

.forgot-panel.active { display: block; }

.forgot-panel h3 {
  color: var(--primary);
  margin-bottom: 6px;
}

.forgot-panel .step-hint {
  color: #666;
  font-size: 13px;
  margin-bottom: 14px;
  line-height: 1.5;
}

/* Step indicator */
.step-dots {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-bottom: 16px;
}
.step-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #ddd;
  transition: background .3s;
}
.step-dot.active { background: var(--primary); }

/* OTP input row */
.otp-row {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}
.otp-row input {
  flex: 1;
  width: 38px;
  height: 48px;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  border: 2px solid #ddd;
  border-radius: 8px;
  background: #fff;
  outline: none;
  transition: border-color .2s;
}
.otp-row input:focus { border-color: var(--primary); }

.resend-row {
  text-align: center;
  margin-bottom: 10px;
  font-size: 13px;
  color: #666;
}
.resend-row button {
  background: none;
  border: none;
  color: var(--primary);
  font-weight: 600;
  cursor: pointer;
  font-size: 13px;
}
.resend-row button:disabled { color: #aaa; cursor: default; }

.secondary-btn {
  width: 100%;
  background: #e5e7eb;
  color: #333;
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
}
  </style>
  <link rel="stylesheet" href="navbar.css">
</head>
<body>
<script src="config.js"></script>
<script>const API_BASE = window.API_BASE || window.location.origin;</script>

<!-- ===== Navbar ===== -->
<header class="navbar">
  <div class="container nav-content">
    <div class="nav-logo">
      <a href="index.html"><img src="no background 1.png" alt="Artivio Logo"></a>
      <span class="artivio">Artivio</span>
    </div>

    <nav>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="product.html"><i data-lucide="shopping-bag" class="icon-sm"></i> Products</a></li>
        <li><a href="customercourses.html"><i data-lucide="book-open" class="icon-sm"></i> Courses</a></li>
        <li><a href="about.html">About</a></li>
        <li><a id="loginLink" href="login.html"><i data-lucide="user" class="icon-sm"></i> Login</a></li>
      </ul>
      <div class="menu-icon" id="menuIcon">
        <i data-lucide="menu"></i>
      </div>
    </nav>
  </div>
</header>

<!-- ===== Login Section ===== -->
<section class="login-section">
  <div class="login-container">

    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to your account</p>

    <!-- Toggle -->
    <div class="role-toggle">
      <button class="active" id="customerBtn">Customer</button>
      <button id="artisanBtn">Artisan</button>
    </div>

    <!-- Login Form -->
    <form class="login-form" id="loginForm">
      <label for="email">Email</label>
      <div class="input-box">
        <i class="fa-regular fa-envelope"></i>
<input 
  type="email" 
  id="email" 
  name="email"
  pattern="[^\s@]+@[^\s@]+\.[^\s@]+"
  placeholder="your@email.com" 
  required
>      </div>

      <label for="password">Password</label>
      <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>

      <div class="forgot-row">
        <button type="button" class="forgot-btn" id="showForgotBtn">Forgot password?</button>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">Sign In as Customer</button>

      <p class="signup-text" id="loginMessage" role="status" aria-live="polite"></p>

      <p class="signup-text">
        Don't have an account?
        <a href="sign-up.html">Sign up</a>
      </p>
    </form>

    <!-- ── Forgot Password Panel (3 steps) ── -->
    <div class="forgot-panel" id="forgotPanel">

      <!-- Step dots -->
      <div class="step-dots">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-dot" id="dot3"></div>
      </div>

      <!-- STEP 1: Enter email -->
      <div id="fpStep1">
        <h3>Reset Password</h3>
        <p class="step-hint">Enter your account email and we'll send you a secure link to reset your password.</p>

        <label for="fpEmail">Email</label>
        <div class="input-box">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="fpEmail" placeholder="your@email.com" required>
        </div>

        <button type="button" class="login-btn" id="sendOtpBtn">Send Reset Link</button>
        <button type="button" class="secondary-btn" id="hideForgotBtn">Back to Login</button>
        <p class="signup-text" id="fpMsg1" role="status" aria-live="polite"></p>
      </div>
    </div><!-- /forgot-panel -->

  </div>
</section>

<!-- ===== INTERNAL JS ===== -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (window.lucide) lucide.createIcons();

  const menuIcon = document.getElementById('menuIcon');
  const navLinks = document.getElementById('navLinks');
  if (menuIcon && navLinks) menuIcon.addEventListener('click', () => navLinks.classList.toggle('active'));

  // ── Role toggle ──────────────────────────────────────────────────────
  const customerBtn = document.getElementById("customerBtn");
  const artisanBtn  = document.getElementById("artisanBtn");
  const loginBtn    = document.getElementById("loginBtn");
  let selectedRole  = "customer";

  if (customerBtn && artisanBtn && loginBtn) {
    customerBtn.addEventListener("click", (e) => {
      e.preventDefault();
      customerBtn.classList.add("active");
      artisanBtn.classList.remove("active");
      loginBtn.textContent = "Sign In as Customer";
      selectedRole = "customer";
    });

    artisanBtn.addEventListener("click", (e) => {
      e.preventDefault();   
      artisanBtn.classList.add("active");
      customerBtn.classList.remove("active");
      loginBtn.textContent = "Sign In as Artisan";
      selectedRole = "artisan";
    });
  }

  // ── Login form ───────────────────────────────────────────────────────
  const loginForm    = document.getElementById("loginForm");
  const loginMessage = document.getElementById("loginMessage");
  const emailInput   = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  if (loginForm) {
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (loginMessage) loginMessage.textContent = "";
      if (loginBtn) {
        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in...";
      }

      try {
        const response = await fetch(`${window.API_BASE}/api/users/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: emailInput.value.trim(), password: passwordInput.value })
        });

        const result = await response.json();
        if (!response.ok || !result.success) {
          if (loginMessage) {
            loginMessage.style.color = "red";
            loginMessage.textContent = result.error || "Login failed";
          }
          if (loginBtn) {
            loginBtn.disabled = false;
            loginBtn.textContent = selectedRole === "artisan" ? "Sign In as Artisan" : "Sign In as Customer";
          }
          return;
        }

        if (selectedRole === "artisan" && !["artisan", "seller"].includes(result.user.role)) {
          if (loginMessage) {
            loginMessage.style.color = "red";
            loginMessage.textContent = "Please switch to Customer login for this account";
          }
          if (loginBtn) {
            loginBtn.disabled = false;
            loginBtn.textContent = "Sign In as Artisan";
          }
          return;
        }
        if (selectedRole === "customer" && result.user.role !== "customer") {
          if (loginMessage) {
            loginMessage.style.color = "red";
            loginMessage.textContent = "Please switch to Artisan login for this account";
          }
          if (loginBtn) {
            loginBtn.disabled = false;
            loginBtn.textContent = "Sign In as Customer";
          }
          return;
        }

        localStorage.setItem("token", result.token);
        localStorage.setItem("user", JSON.stringify(result.user));
        if (loginMessage) {
          loginMessage.style.color = "green";
          loginMessage.textContent = "Login successful. Redirecting...";
        }

        setTimeout(() => {
          if (result.user.role === "admin") window.location.href = "admindashboard.html";
          else if (["artisan", "seller"].includes(result.user.role)) window.location.href = "seller.html";
          else window.location.href = "index.html";
        }, 700);

      } catch (err) {
        if (loginMessage) {
          loginMessage.style.color = "red";
          loginMessage.textContent = "Network error. Please try again.";
        }
        if (loginBtn) {
          loginBtn.disabled = false;
          loginBtn.textContent = selectedRole === "artisan" ? "Sign In as Artisan" : "Sign In as Customer";
        }
      }
    });
  }

  // ── Forgot password panel toggle ─────────────────────────────────────
  const forgotPanel = document.getElementById("forgotPanel");
  const showForgotBtn = document.getElementById("showForgotBtn");
  const hideForgotBtn = document.getElementById("hideForgotBtn");

  if (showForgotBtn && forgotPanel && emailInput) {
    showForgotBtn.addEventListener("click", () => {
      forgotPanel.classList.add("active");
      const fpEmail = document.getElementById("fpEmail");
      if (fpEmail) fpEmail.value = emailInput.value.trim();
    });
  }

  if (hideForgotBtn && forgotPanel) {
    hideForgotBtn.addEventListener("click", () => {
      forgotPanel.classList.remove("active");
      fpReset();
    });
  }

  // ── Forgot password state ─────────────────────────────────────────────
  let fpEmail = "";

  function fpReset() {
    fpEmail = "";
    const fpEmailInput = document.getElementById("fpEmail");
    const fpNewPass = document.getElementById("fpNewPass");
    const fpConfirmPass = document.getElementById("fpConfirmPass");
    
    if (fpEmailInput) fpEmailInput.value = "";
    if (fpNewPass) fpNewPass.value = "";
    if (fpConfirmPass) fpConfirmPass.value = "";
    setMsg("fpMsg1", "", "");
    setMsg("fpMsg3", "", "");
  }

  function setMsg(id, text, color) {
    const el = document.getElementById(id);
    if (el) {
      el.textContent = text;
      el.style.color = color;
    }
  }

  // ── STEP 1: Send Reset Link ───────────────────────────────────────────
  const sendResetLinkBtn = document.getElementById("sendOtpBtn"); // Fixed ID mismatch
  if (sendResetLinkBtn) {
    sendResetLinkBtn.addEventListener("click", async () => {
      const emailInput = document.getElementById("fpEmail");
      if (!emailInput || !emailInput.value) { setMsg("fpMsg1", "Please enter your email", "red"); return; }
      
      const email = emailInput.value.trim();
      if (!email) { 
        setMsg("fpMsg1", "Please enter your email", "red"); 
        return; 
      }

      const btn = document.getElementById("sendOtpBtn");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Sending...";
      }

      try {
        const res = await fetch(`${window.API_BASE}/api/users/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const result = await res.json();

        if (result.success) {
          fpEmail = email;
          setMsg("fpMsg1", "A reset link has been sent to your email. Please check your inbox.", "green");
        } else {
          setMsg("fpMsg1", result.error || "Something went wrong", "red");
        }
      } catch {
        setMsg("fpMsg1", "Network error. Please try again.", "red");
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Send Code";
        }
      }
    });
  }
  
  // NOTE: Steps 2 (OTP) and 3 (New Pass) in this file are currently 
  // unreachable because the backend uses a link-based reset.

  // ── STEP 2: Reset password (on reset-password page) ───────────────────
  const resetPassBtn = document.getElementById("resetPassBtn");
  if (resetPassBtn) {
    resetPassBtn.addEventListener("click", async () => {
      const newPasswordInput = document.getElementById("fpNewPass");
      const confirmPasswordInput = document.getElementById("fpConfirmPass");
      
      if (!newPasswordInput || !confirmPasswordInput) return;
      
      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!newPassword || !confirmPassword) {
        setMsg("fpMsg3", "Both fields are required", "red");
        return;
      }
      if (newPassword.length < 6) {
        setMsg("fpMsg3", "Password must be at least 6 characters", "red");
        return;
      }
      if (newPassword !== confirmPassword) {
        setMsg("fpMsg3", "Passwords do not match", "red");
        return;
      }

      const btn = document.getElementById("resetPassBtn");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Resetting...";
      }

      const token = window.location.pathname.split("/").pop();
      try {
        const res = await fetch(`${window.API_BASE}/api/users/reset-password/${token}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ newPassword })
        });
        const result = await res.json();

        if (result.success) {
          setMsg("fpMsg3", "Password reset successfully! Redirecting…", "green");
          setTimeout(() => window.location.href = "login.html", 2000);
        } else {
          setMsg("fpMsg3", result.error || "Reset failed.", "red");
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Reset Password";
          }
        }
      } catch {
        setMsg("fpMsg3", "Network error.", "red");
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Reset Password";
        }
      }
    });
  }

  // ── Load profile if on profile page ───────────────────────────────────
  function loadProfile() {
    const user = localStorage.getItem("user");
    if (user) {
      try {
        const userData = JSON.parse(user);
        const userNameElement = document.getElementById("userName");
        if (userNameElement) userNameElement.textContent = userData.name || userData.email;
      } catch (e) {
        console.error("Error parsing user data:", e);
      }
    }
  }
  
    loadProfile();
});
</script>

<script src="navbar.js"></script>
</body>
</html>
