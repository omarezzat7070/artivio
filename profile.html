<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Artivio</title>
  <link rel="stylesheet" href="https://omarezzat7070.github.io/artivio/assets/fontawesome/css/all.min.css">
  <script src="assets/lucide.min.js"></script>
  <link rel="stylesheet" href="navbar.css">

  <style>
    :root {
      --primary: #6C2929;
      --bg: #fdf6ee;
      --card: #ffffff;
      --border: #e5e7eb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body { background: var(--bg); color: #333; }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .profile-card {
      background: var(--card);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .profile-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .avatar-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 15px;
      cursor: pointer;
    }

    .avatar {
      width: 120px;
      height: 120px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar i   { font-size: 50px; color: white; }

    .avatar-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
      cursor: pointer;
    }
    .avatar-container:hover .avatar-overlay { opacity: 1; }
    .avatar-overlay i { font-size: 30px; color: white; }

    .profile-header h2 { color: var(--primary); margin-bottom: 5px; }
    .profile-header p  { color: #666; }

    .info-section {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .info-section h3 {
      color: var(--primary);
      margin-bottom: 15px;
      font-size: 18px;
    }

    .info-row {
      display: flex;
      margin-bottom: 12px;
      padding: 8px 0;
      flex-wrap: wrap;
    }

    .info-label {
      width: 120px;
      font-weight: 600;
      color: #666;
    }

    .info-value { flex: 1; color: #333; }

    .edit-btn, .save-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      margin-top: 10px;
    }
    .edit-btn:hover, .save-btn:hover { background: #5a2222; }

    .cancel-btn {
      background: #e5e7eb;
      color: #333;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      margin-left: 10px;
    }
    .cancel-btn:hover { background: #d1d5db; }

    .action-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      margin-top: 10px;
      margin-right: 10px;
    }
    .action-btn:hover { background: #5a2222; }

    .edit-field         { display: none; }
    .edit-field.active  { display: block; }
    .view-field         { display: block; }
    .view-field.hidden  { display: none; }

    input, select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 100%;
      max-width: 300px;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .message.success { background: #d1fae5; color: #065f46; display: block; }
    .message.error   { background: #fee2e2; color: #991b1b; display: block; }

    .upload-box {
      border: 2px dashed var(--primary);
      padding: 20px;
      text-align: center;
      cursor: pointer;
      border-radius: 12px;
      background: #f9f9f9;
      margin-top: 10px;
    }
    .upload-box i { font-size: 30px; color: var(--primary); margin-bottom: 10px; }

    /* ── OTP styles ── */
    .otp-row {
      display: flex;
      gap: 8px;
      margin: 8px 0 16px;
    }
    .otp-row input {
      width: 40px;
      height: 48px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      border: 2px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      max-width: unset;
      padding: 0;
      transition: border-color .2s;
    }
    .otp-row input:focus { border-color: var(--primary); }

    .resend-row {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }
    .resend-row button {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .resend-row button:disabled { color: #aaa; cursor: default; }

    .fp-step        { display: none; }
    .fp-step.active { display: block; }

    .step-dots-p {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    .step-dot-p {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ddd;
      transition: background .3s;
    }
    .step-dot-p.active { background: var(--primary); }

    @media (max-width: 600px) {
      .container { margin: 20px auto; padding: 15px; }
      .profile-card { padding: 20px; }
      .info-row { flex-direction: column; }
      .info-label { width: 100%; margin-bottom: 5px; }
    }
  </style>
</head>
<body>
<script src="config.js"></script>

<header class="navbar">
  <div class="container nav-content">
    <div class="nav-logo">
      <img src="no background 1.png" alt="Artivio Logo">
      <span class="artivio">Artivio</span>
    </div>
    <nav>
      <ul class="nav-links" id="navLinks">
        <li><a href="home.html">Home</a></li>
        <li><a href="product.html"><i data-lucide="shopping-bag" class="icon-sm"></i> Products</a></li>
        <li><a href="customercourses.html"><i data-lucide="book-open" class="icon-sm"></i> Courses</a></li>
        <li><a href="about.html">About</a></li>
        <li><a id="loginLink" href="login.html"><i data-lucide="user" class="icon-sm"></i> Login</a></li>
      </ul>
      <div class="menu-icon" id="menuIcon">
        <i data-lucide="menu"></i>
      </div>
    </nav>
  </div>
</header>

<div class="container">
  <div class="profile-card">

    <!-- Avatar -->
    <div class="profile-header">
      <div class="avatar-container" onclick="document.getElementById('avatarInput').click()">
        <div class="avatar" id="avatarPreview">
          <i class="fa-solid fa-user"></i>
        </div>
        <div class="avatar-overlay">
          <i class="fa-solid fa-camera"></i>
        </div>
      </div>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="uploadAvatar(this)">
      <h2 id="displayName">Loading...</h2>
      <p id="displayEmail">Loading...</p>
    </div>

    <div id="message" class="message"></div>

    <!-- Personal Information -->
    <div class="info-section" id="profileInfo">
      <h3>Personal Information</h3>

      <div class="info-row">
        <div class="info-label">Full Name:</div>
        <div class="view-field" id="viewName">-</div>
        <div class="edit-field" id="editNameField">
          <input type="text" id="editName" placeholder="Enter your name">
        </div>
      </div>

      <div class="info-row">
        <div class="info-label">Email:</div>
        <div class="view-field" id="viewEmail">-</div>
        <div class="edit-field" id="editEmailField">
          <input type="email" id="editEmail" placeholder="Enter your email">
        </div>
      </div>

      <div class="info-row">
        <div class="info-label">Phone:</div>
        <div class="view-field" id="viewPhone">-</div>
        <div class="edit-field" id="editPhoneField">
          <input type="tel" id="editPhone" placeholder="+20 100 123 4567">
        </div>
      </div>

      <div class="info-row">
        <div class="info-label">Gender:</div>
        <div class="view-field" id="viewGender">-</div>
        <div class="edit-field" id="editGenderField">
          <select id="editGender">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
      </div>

      <div class="info-row">
        <div class="info-label">Account Type:</div>
        <div class="info-value" id="viewRole">-</div>
      </div>

      <div class="info-row">
        <div class="info-label">Member Since:</div>
        <div class="info-value" id="viewJoined">-</div>
      </div>

      <div class="info-row" id="actionButtons">
        <button class="edit-btn" onclick="enableEditMode()">Edit Profile</button>
        <button class="save-btn" id="saveBtn" onclick="saveProfile()" style="display:none;">Save Changes</button>
        <button class="cancel-btn" id="cancelBtn" onclick="cancelEdit()" style="display:none;">Cancel</button>
      </div>
    </div>

    <!-- Password Management -->
    <div class="info-section">
      <h3>Password Management</h3>
      <div class="info-row">
        <button class="action-btn" onclick="showChangePassword()">Change Password</button>
        <button class="action-btn" onclick="showForgotPassword()">Forgot Password?</button>
      </div>

      <!-- Change Password -->
      <div id="changePasswordSection" style="display:none;margin-top:15px;">
        <div class="info-row">
          <label for="currentPassword" class="info-label">Current Password:</label>
          <input type="password" id="currentPassword" style="width:100%;max-width:300px;">
        </div>
        <div class="info-row">
          <label for="newPassword" class="info-label">New Password:</label>
          <input type="password" id="newPassword" style="width:100%;max-width:300px;">
        </div>
        <div class="info-row">
          <label for="confirmPassword" class="info-label">Confirm Password:</label>
          <input type="password" id="confirmPassword" style="width:100%;max-width:300px;">
        </div>
        <button class="save-btn" onclick="changePassword()">Update Password</button>
        <button class="cancel-btn" onclick="hideChangePassword()">Cancel</button>
      </div>

      <!-- Forgot Password – 3-step OTP -->
      <div id="forgotPasswordSection" style="display:none;margin-top:15px;">
        <!-- Step 1: email -->
        <div class="fp-step active" id="pfpStep1">
          <p style="color:#555;font-size:13px;margin-bottom:12px;">
            Enter your account email and we'll send you a secure link to reset your password.
          </p>
          <div class="info-row">
            <div class="info-label">Email:</div>
            <input type="email" id="pfpEmail" placeholder="your@email.com"
                   style="width:100%;max-width:300px;">
          </div>
          <button class="save-btn" id="pfpSendBtn" onclick="pfpSendResetLink()">Send Reset Link</button>
          <button class="cancel-btn" onclick="hideForgotPassword()">Cancel</button>
          <p id="pfpMsg1" style="font-size:13px;margin-top:8px;" role="status"></p>
        </div>
      </div><!-- /forgotPasswordSection -->
    </div><!-- /info-section -->

  </div><!-- /profile-card -->
</div><!-- /container -->

<script>
  const API_BASE = window.API_BASE || window.location.origin;
  let userData = null;
  let editMode  = false;

  function getToken() {
    try { return localStorage.getItem('token'); } catch(e) { return null; }
  }

  function showMessage(message, type) {
    const msgDiv = document.getElementById('message');
    msgDiv.textContent = message;
    msgDiv.className   = `message ${type}`;
    msgDiv.style.display = 'block';
    setTimeout(() => { msgDiv.style.display = 'none'; }, 3000);
  }

  // ── Load & display profile ───────────────────────────────────────────────
  async function loadProfile() {
    const token = getToken();
    if (!token) { window.location.href = 'login.html'; return; }

    try {
      const res  = await fetch(`${API_BASE}/api/users/me`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (data.success) { userData = data.data; displayProfile(); }
    } catch (err) {
      console.error('Error loading profile:', err);
      showMessage('Error loading profile', 'error');
    }
  }

  function displayProfile() {
    if (!userData) return;
    document.getElementById('displayName').textContent  = userData.name;
    document.getElementById('displayEmail').textContent = userData.email;
    document.getElementById('viewName').textContent     = userData.name;
    document.getElementById('viewEmail').textContent    = userData.email;
    document.getElementById('viewPhone').textContent    = userData.phone || 'Not provided';
    document.getElementById('viewGender').textContent   = userData.gender === 'male' ? 'Male' : (userData.gender === 'female' ? 'Female' : 'Not specified');
    document.getElementById('viewRole').textContent     = userData.role || 'Customer';
    document.getElementById('viewJoined').textContent   = userData.createdAt ? new Date(userData.createdAt).toLocaleDateString() : 'Recently';

    document.getElementById('editName').value   = userData.name   || '';
    document.getElementById('editEmail').value  = userData.email  || '';
    document.getElementById('editPhone').value  = userData.phone  || '';
    document.getElementById('editGender').value = userData.gender || 'male';

    if (userData.profileImage) {
      document.querySelector('.avatar').innerHTML =
        `<img src="${API_BASE}/uploads/${userData.profileImage}" alt="Profile">`;
    }
  }

  // ── Avatar upload ────────────────────────────────────────────────────────
  async function uploadAvatar(input) {
    if (!input.files || !input.files[0]) return;
    const formData = new FormData();
    formData.append('profileImage', input.files[0]);

    try {
      const res  = await fetch(`${API_BASE}/api/users/upload-avatar`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${getToken()}` },
        body: formData
      });
      const data = await res.json();
      if (data.success) {
        showMessage('Profile picture updated!', 'success');
        document.querySelector('.avatar').innerHTML =
          `<img src="${API_BASE}/uploads/${data.data.profileImage}" alt="Profile">`;
        userData.profileImage = data.data.profileImage;
      } else {
        showMessage(data.error || 'Upload failed', 'error');
      }
    } catch { showMessage('Network error', 'error'); }
  }

  // ── Edit mode ────────────────────────────────────────────────────────────
  function enableEditMode() {
    editMode = true;
    document.querySelectorAll('.view-field').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.edit-field').forEach(el => el.classList.add('active'));
    document.getElementById('saveBtn').style.display   = 'inline-block';
    document.getElementById('cancelBtn').style.display = 'inline-block';
    document.querySelector('.edit-btn').style.display  = 'none';
  }

  function cancelEdit() {
    editMode = false;
    document.querySelectorAll('.view-field').forEach(el => el.classList.remove('hidden'));
    document.querySelectorAll('.edit-field').forEach(el => el.classList.remove('active'));
    document.getElementById('saveBtn').style.display   = 'none';
    document.getElementById('cancelBtn').style.display = 'none';
    document.querySelector('.edit-btn').style.display  = 'inline-block';
    document.getElementById('editName').value   = userData.name   || '';
    document.getElementById('editEmail').value  = userData.email  || '';
    document.getElementById('editPhone').value  = userData.phone  || '';
    document.getElementById('editGender').value = userData.gender || 'male';
  }

  async function saveProfile() {
    const name   = document.getElementById('editName').value.trim();
    const email  = document.getElementById('editEmail').value.trim();
    const phone  = document.getElementById('editPhone').value.trim();
    const gender = document.getElementById('editGender').value;

    if (!name || !email) { showMessage('Name and email are required', 'error'); return; }

    try {
      const res  = await fetch(`${API_BASE}/api/users/update`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${getToken()}`
        },
        body: JSON.stringify({ name, email, phone, gender })
      });
      const data = await res.json();
      if (data.success) {
        userData = data.data;
        displayProfile();
        cancelEdit();
        showMessage('Profile updated successfully!', 'success');
        const storedUser = JSON.parse(localStorage.getItem('user') || '{}');
        storedUser.name  = name;
        storedUser.email = email;
        localStorage.setItem('user', JSON.stringify(storedUser));
      } else {
        showMessage(data.error || 'Update failed', 'error');
      }
    } catch { showMessage('Network error', 'error'); }
  }

  // ── Change password ──────────────────────────────────────────────────────
  function showChangePassword() {
    document.getElementById('changePasswordSection').style.display  = 'block';
    document.getElementById('forgotPasswordSection').style.display  = 'none';
  }

  function hideChangePassword() {
    document.getElementById('changePasswordSection').style.display = 'none';
    document.getElementById('currentPassword').value = '';
    document.getElementById('newPassword').value     = '';
    document.getElementById('confirmPassword').value = '';
  }

  async function changePassword() {
    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword     = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!currentPassword || !newPassword || !confirmPassword) {
      showMessage('All password fields are required', 'error'); return;
    }
    if (newPassword.length < 6) { showMessage('New password must be at least 6 characters', 'error'); return; }
    if (newPassword !== confirmPassword) { showMessage('New passwords do not match', 'error'); return; }

    try {
      const res  = await fetch(`${API_BASE}/api/users/change-password`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${getToken()}`
        },
        body: JSON.stringify({ currentPassword, newPassword })
      });
      const data = await res.json();
      if (res.ok) {
        showMessage('Password changed successfully!', 'success');
        hideChangePassword();
      } else {
        showMessage(data.error || 'Failed to change password', 'error');
      }
    } catch { showMessage('Network error', 'error'); }
  }

  // ── Forgot password – OTP flow ────────────────────────────────────────────
  let pfpEmail = "";
  let pfpOtp   = "";
  let pfpTimerInterval = null;

  function showForgotPassword() {
    document.getElementById('forgotPasswordSection').style.display  = 'block';
    document.getElementById('changePasswordSection').style.display  = 'none';
    if (userData && userData.email) {
      document.getElementById('pfpEmail').value = userData.email;
    }
  }

  function hideForgotPassword() {
    document.getElementById('forgotPasswordSection').style.display = 'none';
    pfpReset();
  }

  function pfpReset() {
    pfpEmail = ""; pfpOtp = "";
    pfpGoTo(1);
    document.getElementById('pfpEmail').value       = '';
    document.getElementById('pfpNewPass').value     = '';
    document.getElementById('pfpConfirmPass').value = '';
    pfpClearOtp();
    ['pfpMsg1','pfpMsg2','pfpMsg3'].forEach(id => {
      const el = document.getElementById(id);
      el.textContent = ''; el.style.color = '';
    });
    clearInterval(pfpTimerInterval);
  }

  function pfpGoTo(step) {
    [1,2,3].forEach(n => {
      document.getElementById(`pfpStep${n}`).classList.toggle('active', n === step);
      document.getElementById(`pdot${n}`).classList.toggle('active', n <= step);
    });
  }

  function pfpSetMsg(id, text, color) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.style.color  = color;
  }

  // OTP auto-advance
  (function () {
    const row = document.getElementById('pfpOtpRow');
    if (!row) return;
    const inputs = Array.from(row.querySelectorAll('input'));
    inputs.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/\D/g, '').slice(-1);
        if (inp.value && i < inputs.length - 1) inputs[i+1].focus();
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i-1].focus();
      });
      inp.addEventListener('paste', e => {
        e.preventDefault();
        const digits = e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);
        digits.split('').forEach((d,idx) => { if (inputs[idx]) inputs[idx].value = d; });
        if (inputs[digits.length]) inputs[digits.length].focus();
      });
    });
  })();

  function pfpGetOtp() {
    return Array.from(document.querySelectorAll('#pfpOtpRow input')).map(i => i.value).join('');
  }
  function pfpClearOtp() {
    document.querySelectorAll('#pfpOtpRow input').forEach(i => i.value = '');
  }

  function pfpStartTimer(seconds) {
    clearInterval(pfpTimerInterval);
    const timerEl   = document.getElementById('pfpResendTimer');
    const countEl   = document.getElementById('pfpTimerCount');
    const resendBtn = document.getElementById('pfpResendBtn');
    timerEl.style.display   = 'inline';
    resendBtn.style.display  = 'none';
    let remaining = seconds;
    countEl.textContent = remaining;
    pfpTimerInterval = setInterval(() => {
      remaining--;
      countEl.textContent = remaining;
      if (remaining <= 0) {
        clearInterval(pfpTimerInterval);
        timerEl.style.display  = 'none';
        resendBtn.style.display = 'inline';
      }
    }, 1000);
  }

 async function sendResetLink() {
  const email = document.getElementById('pfpEmail').value.trim();
  if (!email) { pfpSetMsg('pfpMsg1', 'Please enter your email', 'red'); return; }

  try {
    const res = await fetch(`${API_BASE}/api/users/forgot-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const result = await res.json();
    if (result.success) {
      pfpSetMsg('pfpMsg1', 'If registered, a reset link has been sent to your email.', 'green');
    } else {
      pfpSetMsg('pfpMsg1', result.error || 'Something went wrong', 'red');
    }
  } catch {
    pfpSetMsg('pfpMsg1', 'Network error.', 'red');
  }
}


  async function pfpResend() {
    pfpSetMsg('pfpMsg2', '', '');
    try {
      const res    = await fetch(`${API_BASE}/api/users/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pfpEmail })
      });
      const result = await res.json();
      if (!result.success) {
        pfpSetMsg('pfpMsg2', result.error || 'Could not resend', 'red');
      } else {
        pfpClearOtp();
        pfpStartTimer(60);
        pfpSetMsg('pfpMsg2', 'New code sent!', 'green');
        document.querySelector('#pfpOtpRow input').focus();
      }
    } catch { pfpSetMsg('pfpMsg2', 'Network error.', 'red'); }
  }

  async function pfpVerifyOtp() {
    const otp = pfpGetOtp();
    if (otp.length < 6) { pfpSetMsg('pfpMsg2', 'Enter all 6 digits', 'red'); return; }
    pfpSetMsg('pfpMsg2', '', '');

    try {
      const res    = await fetch(`${API_BASE}/api/users/verify-otp`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pfpEmail, otp })
      });
      const result = await res.json();
      if (!result.success) {
        pfpSetMsg('pfpMsg2', result.error || 'Invalid code', 'red');
      } else {
        pfpOtp = otp;
        clearInterval(pfpTimerInterval);
        pfpGoTo(3);
        document.getElementById('pfpNewPass').focus();
      }
    } catch { pfpSetMsg('pfpMsg2', 'Network error.', 'red'); }
  }

  async function resetPassword() {
  const newPassword = document.getElementById('pfpNewPass').value;
  const confirmPassword = document.getElementById('pfpConfirmPass').value;

  if (!newPassword || !confirmPassword) { pfpSetMsg('pfpMsg3', 'Both fields are required', 'red'); return; }
  if (newPassword.length < 6) { pfpSetMsg('pfpMsg3', 'Min 6 characters', 'red'); return; }
  if (newPassword !== confirmPassword) { pfpSetMsg('pfpMsg3', 'Passwords do not match', 'red'); return; }

  const token = window.location.pathname.split("/").pop(); // token from URL
  try {
    const res = await fetch(`${API_BASE}/api/users/reset-password/${token}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ newPassword })
    });
    const result = await res.json();
    if (result.success) {
      pfpSetMsg('fpMsg3', 'Password reset successfully! Redirecting…', 'green');
      setTimeout(() => window.location.href = 'login.html', 2000);
    } else {
      pfpSetMsg('fpMsg3', result.error || 'Reset failed.', 'red');
    }
  } catch {
    pfpSetMsg('fpMsg3', 'Network error.', 'red');
  }
}

    if (window.lucide) lucide.createIcons();
    loadProfile();
    const menuIcon = document.getElementById('menuIcon');
    const navLinks = document.getElementById('navLinks');
    if (menuIcon && navLinks) {
      menuIcon.addEventListener('click', () => navLinks.classList.toggle('active'));
    }
  });
</script>
